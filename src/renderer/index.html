<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FL Agenda — Sistema de Gerenciamento para Estética e Beleza" />
  <title>FL Agenda — Agenda</title>

  <!-- Design tokens e base -->
  <link rel="stylesheet" href="../shared/styles/tokens.css" />
  <link rel="stylesheet" href="../shared/styles/global.css" />

  <!-- Estilos dos componentes -->
  <link rel="stylesheet" href="../shared/ui/Sidebar/Sidebar.css" />
  <link rel="stylesheet" href="../modules/agenda/views/AgendaView/AgendaView.css" />
</head>
<body>

<div id="app">

  <!-- ═══════════════════════════════════════════════════════
       SIDEBAR — Componente Reutilizável
       ═══════════════════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menu de navegação">

    <!-- Identidade -->
    <div class="sidebar__brand">
      <span class="sidebar__brand-name">FL Agenda</span>
      <span class="sidebar__brand-sub">Espaço FL</span>
    </div>

    <!-- Menu de navegação -->
    <nav class="sidebar__nav">

      <button class="sidebar__nav-item sidebar__nav-item--active" id="nav-agenda" data-route="/agenda" aria-current="page">
        <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Agenda
      </button>

      <button class="sidebar__nav-item" id="nav-caixa" data-route="/caixa">
        <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
        </svg>
        Caixa
      </button>

      <button class="sidebar__nav-item" id="nav-clientes" data-route="/clientes">
        <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Clientes
      </button>

      <button class="sidebar__nav-item" id="nav-servicos" data-route="/servicos">
        <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        Serviços
      </button>

      <button class="sidebar__nav-item" id="nav-comandas" data-route="/comandas">
        <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Comandas
      </button>
    </nav>

    <!-- Divisor -->
    <div class="sidebar__divider"></div>

    <!-- Logout -->
    <div class="sidebar__footer">
      <button class="sidebar__nav-item" id="nav-logout">
        <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════════════════
       AGENDA VIEW — Tela Central
       ═══════════════════════════════════════════════════════ -->
  <main class="agenda-view" id="agenda-view">

    <!-- Cabeçalho -->
    <header class="agenda-header" id="agenda-header">
      <div class="agenda-header__left">
        <h1 class="agenda-header__title">Agenda — Visão Geral</h1>
        <span class="agenda-header__date" id="agenda-date">Carregando...</span>
      </div>

      <!-- Badge Caixa Aberto -->
      <div class="agenda-header__caixa-badge" id="caixa-badge" role="status" aria-label="Status do caixa">
        <span class="agenda-header__caixa-dot" id="caixa-dot"></span>
        <span id="caixa-label">Caixa Aberto</span>
      </div>

      <!-- Busca por profissional -->
      <label class="agenda-header__search" for="search-profissional">
        <svg class="agenda-header__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          class="agenda-header__search-input"
          id="search-profissional"
          type="text"
          placeholder="Procurar profissional..."
          autocomplete="off"
          aria-label="Buscar profissional na agenda"
        />
      </label>
    </header>

    <!-- Grade -->
    <div class="agenda-grid-wrapper">

      <!-- Cabeçalho dos profissionais (sticky) -->
      <div class="agenda-prof-header" id="agenda-prof-header">
        <!-- Célula do relógio -->
        <div class="agenda-prof-header__timecol" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="var(--outline)">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <!-- Colunas dos profissionais -->
        <div class="agenda-prof-header__scroll" id="prof-header-scroll">
          <!-- Populado pelo JS -->
        </div>
      </div>

      <!-- Corpo da grade -->
      <div class="agenda-grid-body" id="agenda-grid-body">

        <!-- Coluna de horários -->
        <div class="agenda-timecol" id="agenda-timecol">
          <!-- Linha de hora atual (posicionada pelo JS) -->
          <div class="agenda-now-line" id="now-line" role="presentation">
            <span class="agenda-now-line__dot"></span>
            <span class="agenda-now-line__rule"></span>
          </div>
          <!-- Slots de horário (populados pelo JS) -->
        </div>

        <!-- Colunas de profissionais com cards -->
        <div class="agenda-cols" id="agenda-cols">
          <!-- Populado pelo JS -->
        </div>

      </div>
    </div>

    <!-- FAB — Novo Agendamento -->
    <button class="agenda-fab" id="btn-novo-agendamento" aria-label="Criar novo agendamento" title="Novo agendamento">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

  </main><!-- /agenda-view -->

</div><!-- /app -->

<script src="agenda.js"></script>
</body>
</html>
